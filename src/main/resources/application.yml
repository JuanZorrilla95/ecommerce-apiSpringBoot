spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/ecommerce?options=-c%20TimeZone=UTC
    username: ecommerce_user
    password: ecommerce_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8080
